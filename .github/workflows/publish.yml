name: Publish to PyPI

# Publishes on every GitHub Release using PyPI Trusted Publishing (OIDC) — no
# API token or secret required. One-time setup on PyPI:
#   PyPI → your project → Publishing → add a trusted publisher:
#     owner = <your gh user>, repo = vault-engine,
#     workflow = publish.yml, environment = pypi
# Then: create a GitHub Release (tag e.g. v0.1.0) and this runs.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write        # required for trusted publishing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7f25271a4aa483500f742f9492b2ab5648d61011 # v1.12.4
        with:
          skip-existing: true
